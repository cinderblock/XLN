name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options: [next, latest]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for short-lived
      # credentials. There is no NPM_TOKEN and no secret of any kind.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Dependencies come from Bun, but publishing goes through npm — trusted
      # publishing and provenance attestation are both npm features.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships something recent
      # enough today, but pinning the floor here means a Node image update can
      # never silently regress it.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run check:package

      - name: Pick the dist-tag
        id: disttag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Any prerelease version (1.0.0-alpha.1) goes to `next`, never to
            # `latest` — publishing a prerelease as `latest` would push it to
            # everyone running a bare `npm install xln`.
            version=$(node -p "require('./package.json').version")
            case "$version" in
              *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
              *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. npm detects the OIDC token from the id-token
      # permission above and mints a short-lived credential itself.
      # Provenance attestation is generated automatically under trusted
      # publishing, so --provenance is not passed explicitly.
      - run: npm publish --access public --tag ${{ steps.disttag.outputs.tag }}

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: next
        type: choice
        options: [next, latest]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance attestation.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Dependencies come from Bun, but the publish itself goes through npm:
      # provenance attestation is an npm feature and needs npm >= 9.5.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run check:package

      - name: Pick the dist-tag
        id: disttag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Any prerelease version (1.0.0-alpha.1) goes to `next`, never to
            # `latest` — publishing a prerelease as `latest` would push it to
            # everyone running a bare `npm install xln`.
            version=$(node -p "require('./package.json').version")
            case "$version" in
              *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
              *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

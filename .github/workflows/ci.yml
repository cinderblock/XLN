name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor declared in engines; test it explicitly rather
        # than trusting the range.
        node: ['20.19', '22', '24']
        os: [ubuntu-latest]
        include:
          # The transport is socket code, so cover the other platforms once.
          - node: '24'
            os: windows-latest
          - node: '24'
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Build first: some tests load dist/ through both ESM and CommonJS to
      # catch a broken exports map before it reaches the registry.
      - run: npm run build

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fail loudly if the tarball would ship something unexpected.
      - run: npm pack --dry-run

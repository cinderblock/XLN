name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor declared in engines; test it explicitly rather
        # than trusting the range.
        node: ['20.19', '22', '24']
        os: [ubuntu-latest]
        include:
          # The transport is socket code, so cover the other platforms once.
          - node: '24'
            os: windows-latest
          - node: '24'
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Dependencies are installed with Bun, but the suite runs on Node — the
      # library targets Node and the matrix is what proves the engines range.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile

      # Build first: some tests load dist/ through both ESM and CommonJS to
      # catch a broken exports map before it reaches the registry.
      - run: bun run build

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run build
      # publint checks the exports map; attw checks that types resolve under
      # every module mode, not just the one we happen to develop in.
      - run: bun run check:package

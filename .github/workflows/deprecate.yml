name: Deprecate

# Marking a version deprecated is a registry change, so it goes through CI for
# the same reasons publishing does — no credentials on a workstation, and an
# auditable record of who asked for what.
#
# This is metadata only. It does not unpublish anything: the version stays
# installable, and consumers simply get a warning. Reversible by re-running
# with an empty message.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Version or range to deprecate, e.g. 1.0.0-alpha.1'
        required: true
        type: string
      message:
        description: 'Warning shown on install. Empty string un-deprecates.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Deprecate
        run: |
          echo "Deprecating xln@${{ inputs.spec }}"
          npm deprecate "xln@${{ inputs.spec }}" "${{ inputs.message }}"

      - name: Show the result
        run: npm view xln versions --json && npm view xln deprecated --json || true
